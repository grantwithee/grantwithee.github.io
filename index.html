      border-radius: var(--radius);

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title{ font-weight: 700; }
    a{ color: var(--link); text-decoration:none; font-weight: 650; }
    a:hover{ text-decoration: underline; }

    footer{
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .95rem;
      display:flex;
