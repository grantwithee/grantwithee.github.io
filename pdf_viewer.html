<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer</title>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#f6f7f9;
      --text:#0b0c0f;
      --muted:#5b6472;
      --line:#e6e8ee;
      --link:#0b5fff;
      --radius:16px;
      --shadow:0 8px 24px rgba(17,24,39,.08);
      --max:1200px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg);
      color:var(--text);
      padding:56px 18px;
    }
    .wrap{width:min(var(--max),92vw);margin:0 auto;}
    header{
      display:grid;
      grid-template-columns:1fr auto;
      gap:14px;
      align-items:center;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-size:clamp(1.3rem,2.5vw,1.8rem);
    }
    .back{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      text-decoration:none;
      color:var(--link);
      font-weight:750;
      background:#fff;
    }
    .frame{
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow);
    }
    iframe{
      width:100%;
      height:calc(100vh - 220px);
      border:none;
      background:#fff;
    }
    .meta{
      background:var(--panel);
      border-top:1px solid var(--line);
      padding:12px 14px;
      font-size:.95rem;
      color:var(--muted);
      display:flex;
      justify-content:flex-end;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">PDF</h1>
      <a class="back" href="javascript:history.back()">← Back</a>
    </header>

    <div class="frame">
      <iframe id="pdf"></iframe>
      <div class="meta">
        <!-- intentionally empty (no directory shown) -->
      </div>
    </div>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);
    const src = p.get("src");
    const title = p.get("title") || "PDF";

    const iframe = document.getElementById("pdf");
    const t = document.getElementById("title");

    if (src) {
      iframe.src = src;
      t.textContent = title;
    } else {
      t.textContent = "PDF not found";
    }
  </script>
</body>
</html>
